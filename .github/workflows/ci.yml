name: build-and-test

on:
  push:
    branches: [ main, "section-*" ]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore VibeCast.sln --verbosity minimal
      - name: Build
        run: dotnet build VibeCast.sln --configuration Release --no-restore
      - name: Verify EF Core model and migrations
        shell: bash
        run: |
          dotnet tool install --global dotnet-ef --version 10.0.10
          dotnet ef migrations has-pending-model-changes \
            --project src/VibeCast.Infrastructure/VibeCast.Infrastructure.csproj \
            --startup-project src/VibeCast.Web/VibeCast.Web.csproj \
            --configuration Release \
            --no-build
      - name: Validate deployment Bicep
        shell: bash
        run: |
          if [ -f infra/container-app.bicep ]; then
            az bicep build --file infra/container-app.bicep --stdout > /dev/null
          fi
      - name: Parse deployment PowerShell scripts
        shell: pwsh
        run: |
          $scripts = @(
            'infra/bootstrap-production-database.ps1',
            'infra/deploy-vibecast-containerapp.ps1'
          )
          foreach ($script in $scripts) {
            if (-not (Test-Path $script)) { continue }
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $script).Path, [ref]$tokens, [ref]$errors)
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error "$script : $_" }
              throw "PowerShell parser found $($errors.Count) errors in $script"
            }
          }
      - name: Test
        run: dotnet test VibeCast.sln --configuration Release --no-build --logger "trx;LogFileName=test-results.trx"
