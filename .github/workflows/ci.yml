name: build-and-test

on:
  push:
    branches: [ main, "section-*" ]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        shell: bash
        run: |
          if ! dotnet restore VibeCast.sln --verbosity minimal > restore.log 2>&1; then
            cat restore.log
            exit 1
          fi
      - name: Build
        run: dotnet build VibeCast.sln --configuration Release --no-restore
      - name: Test
        run: dotnet test VibeCast.sln --configuration Release --no-build --logger "trx;LogFileName=test-results.trx"
