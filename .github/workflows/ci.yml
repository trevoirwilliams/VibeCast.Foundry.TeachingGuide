name: build-and-test

on:
  push:
    branches: [ main, "section-*" ]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore VibeCast.sln --verbosity minimal
      - name: Build
        run: dotnet build VibeCast.sln --configuration Release --no-restore
      - name: Verify EF Core model and migrations
        shell: bash
        run: |
          dotnet tool install --global dotnet-ef --version 10.0.10
          dotnet ef migrations has-pending-model-changes \
            --project src/VibeCast.Infrastructure/VibeCast.Infrastructure.csproj \
            --startup-project src/VibeCast.Web/VibeCast.Web.csproj \
            --configuration Release \
            --no-build
      - name: Test
        run: dotnet test VibeCast.sln --configuration Release --no-build --logger "trx;LogFileName=test-results.trx"
