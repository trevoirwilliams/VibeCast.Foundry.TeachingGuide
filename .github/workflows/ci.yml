name: build-and-test

on:
  push:
    branches: [ main, "section-*" ]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore VibeCast.sln --verbosity minimal
      - name: Build
        run: dotnet build VibeCast.sln --configuration Release --no-restore
      - name: Test
        id: test
        continue-on-error: true
        shell: bash
        run: dotnet test VibeCast.sln --configuration Release --no-build --logger "trx;LogFileName=test-results.trx" --verbosity normal > test.log 2>&1
      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-diagnostics
          path: |
            test.log
            **/TestResults/**
      - name: Stop after test failure
        if: steps.test.outcome == 'failure'
        run: exit 1
