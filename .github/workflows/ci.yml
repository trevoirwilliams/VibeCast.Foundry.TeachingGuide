name: build-and-test

on:
  push:
    branches: [ main, "section-*" ]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        id: restore
        continue-on-error: true
        shell: bash
        run: dotnet restore VibeCast.sln --verbosity minimal > restore.log 2>&1
      - name: Upload restore diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: restore-diagnostics
          path: restore.log
      - name: Stop after restore failure
        if: steps.restore.outcome == 'failure'
        run: exit 1
      - name: Build
        run: dotnet build VibeCast.sln --configuration Release --no-restore
      - name: Test
        run: dotnet test VibeCast.sln --configuration Release --no-build --logger "trx;LogFileName=test-results.trx"
